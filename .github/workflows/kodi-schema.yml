name: Kodi add-on schema

# Keeps the add-on database DDL in `files/get_kodi_addon.py` and the codename
# map in `vars/kodi_codenames.yml` in sync with Kodi's source.  See
# `scripts/kodi_addon_schema.py`.

on:
  pull_request:
    paths:
      - .github/workflows/kodi-schema.yml
      - files/get_kodi_addon.py
      - scripts/kodi_addon_schema.py
      - scripts/tests/**
      - tasks/facts.yml
      - vars/kodi_codenames.yml
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check generated schema
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -W ignore::SyntaxWarning -m unittest discover -s scripts/tests -t . -v
      - name: Compare generated code with Kodi's source
        run: python3 scripts/kodi_addon_schema.py --check

  update:
    name: Update from Kodi's source
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: bot/kodi-addon-schema
      BASE: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate from Kodi's release tags
        run: python3 scripts/kodi_addon_schema.py --write --report > "$RUNNER_TEMP/report.md"
      - name: Run unit tests
        run: python3 -W ignore::SyntaxWarning -m unittest discover -s scripts/tests -t . -v
      - name: Open or update pull request
        run: |
          if [ -z "$(git status --porcelain -- files/get_kodi_addon.py vars/kodi_codenames.yml)" ]; then
            echo "Generated files are up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A files/get_kodi_addon.py vars/kodi_codenames.yml
          git commit -m "chore: update Kodi add-on schema and codenames from upstream"
          git push --force origin "$BRANCH"

          {
            echo "Regenerated by \`scripts/kodi_addon_schema.py --write\` from Kodi's release tags."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "This pull request was opened with \`GITHUB_TOKEN\`, so CI does not run on it"
            echo "automatically. Close and reopen it, or run the \"Run kodi-ansible-role tests\""
            echo "workflow on \`$BRANCH\` by hand."
          } > "$RUNNER_TEMP/body.md"

          state="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)"
          if [ "$state" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Update Kodi add-on schema and codenames from upstream" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
      # Fails the run when Kodi's development branch has an add-on schema that
      # no release has yet: an early warning, with nothing to update.
      - name: Check Kodi's master branch
        run: python3 scripts/kodi_addon_schema.py --check-master
