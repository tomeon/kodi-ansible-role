name: Run kodi-ansible-role tests
on:
  pull_request:
  push:
  workflow_dispatch:
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  native:
    name: Run test playbook
    runs-on: ubuntu-22.04
    strategy:
      # Report results for every distribution, not just the first failure.
      fail-fast: false
      matrix:
        # Supported stable/LTS releases, plus the current interim and
        # development releases where available:
        # - Alpine: https://alpinelinux.org/releases/
        # - Debian: https://www.debian.org/releases/
        # - Ubuntu: https://ubuntu.com/about/release-cycle
        image:
          - alpine:3.22
          - alpine:3.23
          - alpine:3.24
          - archlinux/archlinux
          - debian:bookworm
          - debian:trixie
          - debian:forky
          - debian:sid
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - ubuntu:26.10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install testing dependencies
        run: |
          { apk add --no-cache ansible sudo ; } || :
          {
               echo 'tzdata tzdata/Areas select Europe' | debconf-set-selections \
            && echo 'tzdata tzdata/Zones/Europe select Bratislava' | debconf-set-selections \
            && apt -y update \
            && apt -y upgrade \
            && apt -y install --no-install-recommends ansible sudo
          } || :
          { pacman --noconfirm -Sy archlinux-keyring && pacman --noconfirm -Su && pacman --noconfirm -S ansible sudo ; } || :
      - name: Run test playbook
        # Force `kodi_service_enabled` to `false`, as we can't count on being
        # able to use the distribution's service manager/supervisor (e.g.
        # OpenRC under Alpine Linux) in a container.
        run: |
          ansible-playbook -vv --become -c local -i localhost, -e kodi_service_enabled=false ./tests/test.yml
  nix:
    name: Run Nix actions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Install upstream Nix rather than Determinate Nix, and skip the
          # FlakeHub login.
          determinate: false
      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Run Nix flake checks
        run: |
          nix flake check -L
